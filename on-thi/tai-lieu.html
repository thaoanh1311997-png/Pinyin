<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../shared/nav-head.js?v=13"></script>
<title>Tài liệu ôn thi</title>
<meta name="theme-color" content="#fff7ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ef; --card:#fff; --ink:#2b2622; --muted:#7a6f66; --line:#efe3d6;
  --pri:#ff7a59; --soft:#fff0e8; --teal:#1fa39a; --teal-soft:#e3f6f3; --blue:#2f6fd0; --blue-soft:#e8f0fd;
  --red:#c62828; --brown:#7a4a12; --cream:#fff6e5; --cream-line:#f1dcb5; --bad:#e0483e; --bad-soft:#fde9e7;
  --r:18px; --shadow:0 2px 0 rgba(120,80,40,.06),0 6px 20px rgba(120,80,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:16px;line-height:1.55}
.zh,.zh *{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
h1,h2,h3,.baloo{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}

.bar{position:sticky;top:0;z-index:10;background:rgba(255,247,239,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex:none;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.bar .t{font-weight:700;font-size:17px;line-height:1.2}
.bar .s{font-size:12px;color:var(--muted)}
.printbtn{margin-left:auto;background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}

.docs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.add{background:var(--soft);border-color:#ffd5c6;color:#c4502f}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#f3e6d8;border-radius:16px;padding:5px;margin:10px 0}
.tab{padding:10px 4px;border-radius:12px;font-weight:700;font-size:15px;color:#6b5d51;line-height:1.2}
.tab small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(120,80,40,.12)}
.vt{width:100%;border-collapse:collapse;margin:6px 0 14px}
.vt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt .vn{color:#b49a85;font-size:12px;width:22px}
.vt .vz{font-size:22px;font-weight:600;white-space:nowrap}
.vt .vp{color:#c4502f;font-size:15px}
.vt .vk{color:#9b8775;font-size:12px;white-space:nowrap}
.vt .vm{font-size:15px}
.say{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;font-size:14px;margin-left:6px;vertical-align:middle;cursor:pointer}
.vtabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.vtab{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.vtab.on{background:#f26b43;border-color:#f26b43;color:#fff}
.fc{background:linear-gradient(160deg,#fff7ef,#ffe9dc);border:2px solid #ffd5c6;border-radius:22px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc .z{font-size:56px;font-weight:700;line-height:1.2}
.fc .p{font-size:22px;color:#c4502f;margin-top:10px}
.fc .m{font-size:18px;margin-top:6px}
.fc .k{font-size:13px;color:#9b8775;margin-top:4px}
.fc .tip{font-size:13px;color:#b49a85;margin-top:14px}
.fcnav{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0}
.fcnav button{padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.fcnav .c{min-width:70px;text-align:center;color:#9b8775;font-weight:600}
.qz{text-align:center}
.qz .z{font-size:52px;font-weight:700;margin:6px 0}
.qz .ask{color:#9b8775;font-size:14px}
.qopts{display:grid;gap:8px;margin:14px 0}
.qopt{padding:13px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px;text-align:left}
.qopt.ok{border-color:#3aa76d;background:#e6f7ee}
.qopt.no{border-color:#e0524a;background:#fde8e6}
.qscore{font-weight:700;color:#c4502f}
.vnote{background:#fff4d6;border-radius:12px;padding:8px 12px;font-size:14px;margin:4px 0 10px}
@media print{.say,.vtabs{display:none}}
.lesbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.lchip{padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.lchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tool{padding:7px 12px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px;font-weight:600}
.tool.on{background:var(--teal-soft);border-color:#b8e5df;color:#127a72}

/* ---------- document look (giống file in) ---------- */
.paper{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px}
.doc-title{text-align:center;margin-bottom:14px}
.doc-title h1{font-size:26px;color:var(--red);letter-spacing:.02em}
.doc-title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.les-h{margin:26px 0 4px;padding-bottom:6px;border-bottom:2.5px solid var(--red)}
.les-h:first-child{margin-top:0}
.les-h .n{font-family:"Baloo 2";font-weight:800;color:var(--red);font-size:22px;line-height:1.25}
.les-h .n .zh{font-weight:700;font-size:21px}
.les-h .v{color:#8a5a50;font-style:italic;font-size:15px}
.txt-h{margin:18px 0 8px;font-weight:700;color:var(--blue);font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.txt-h .zh{font-size:17px}
.txt-h .v{color:var(--muted);font-weight:500;font-size:14px}
.badge{font-size:11px;font-weight:700;background:var(--soft);color:#c4502f;border-radius:999px;padding:1px 8px}
table.bi{width:100%;border-collapse:collapse;table-layout:fixed}
table.bi th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1.5px solid var(--line)}
table.bi td{vertical-align:top;padding:8px;border-bottom:1px solid #f3ebe2;font-size:15.5px;line-height:1.6}
table.bi td.c-zh{font-size:18px;line-height:1.7}
table.bi td.c-vi{color:#3d3530}
table.bi tr:nth-child(even) td{background:#fffaf5}
table.bi td.c-num{width:30px;color:#c3b6a9;font-size:12px;font-family:"Be Vietnam Pro";padding-right:0}
table.bi col.num{width:28px}
.c-write textarea{width:100%;min-height:52px;border:1.5px dashed #e5d5c4;border-radius:10px;padding:6px 8px;font-family:"Noto Sans SC",sans-serif;font-size:17px;background:#fffdfb;resize:vertical;outline:none}
.c-write textarea:focus{border-color:var(--pri);border-style:solid}
.c-write .ans{margin-top:4px;color:var(--teal);font-size:16px}
.c-write .ans.hide{display:none}
.sim{font-size:12.5px;font-weight:700;margin-top:2px}.sim.ok{color:#15803d}.sim.mid{color:#b45309}.sim.bad{color:var(--bad)}
@media print{.sim{display:none}}
.pad{position:relative;border:1.5px dashed #e5d5c4;border-radius:10px;background-color:#fffdfb;background-image:linear-gradient(#f3e6d8 1px,transparent 1px);background-size:100% 46px;background-position:0 45px;height:140px;overflow:hidden;touch-action:pan-y}
.pad.finger{touch-action:none;border-color:var(--pri)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.padtools{position:absolute;right:4px;top:4px;display:flex;gap:4px;z-index:2}
.padtools button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;color:#6b5d51}
.pad .ph{position:absolute;left:10px;top:8px;font-size:12.5px;color:#c9b8a6;pointer-events:none}
@media (max-width:700px){ .paper.ink table.bi tr{display:grid;grid-template-columns:24px 1fr} .paper.ink table.bi td.c-write{grid-column:1/-1;padding-top:0} .paper.ink .pad{height:150px} }
.tool.mode{background:#2f2520;color:#fff;border-color:#2f2520}
.show-all .c-write .ans.hide{display:block}
.peek{font-size:12px;color:var(--teal);font-weight:600;margin-top:4px}

/* ngữ pháp */
.sum{width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:6px}
.sum th{background:#c62828;color:#fff;text-align:left;padding:7px 8px;font-size:13px}
.sum td{border-bottom:1px solid #f0e2d3;padding:7px 8px;vertical-align:top}
.sum td:first-child{font-weight:700;color:var(--red);width:44px}
.sum tr:nth-child(even) td{background:#fffaf5}
.gp{margin:16px 0 18px}
.gp-h{color:var(--blue);font-weight:700;font-size:17px;margin-bottom:8px;line-height:1.4}
.gp-h .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--blue);color:#fff;font-size:13px;margin-right:6px;vertical-align:2px}
.fbox{background:var(--cream);border:1px solid var(--cream-line);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.fbox div{color:var(--brown);font-weight:700;font-size:15.5px;line-height:1.65}
.fbox div::before{content:"▸ ";color:#c08a3e}
.gp-l{font-weight:700;font-size:14px;margin:8px 0 2px}
.gp p{margin:2px 0 6px;font-size:15.5px}
.gex{margin:4px 0 6px 2px}
.gex .z{font-size:17.5px;line-height:1.6}
.gex .z b{color:var(--muted);font-weight:500;font-family:"Be Vietnam Pro";font-size:13px;margin-right:4px}
.gex .v{font-style:italic;color:#6b5d51;font-size:14.5px;padding-left:22px}
.warn{color:var(--red);font-size:15px;margin:4px 0}
.warn b{font-weight:700}

/* upload */
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.panel h2{font-size:21px;margin-bottom:6px}
.drop{border:2px dashed #f0c9b8;border-radius:16px;background:var(--soft);padding:22px 14px;text-align:center;cursor:pointer;display:block}
.drop b{display:block;font-size:17px;margin:6px 0 2px}
.drop span{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15.5px}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 3px 0 #e35d3c}
.btn-line{background:#fff;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdfb;outline:none;font-size:15px}
.inp:focus{border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px}
.small{font-size:13px}
.steps{margin:12px 0 0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;padding:5px 0;font-size:14.5px}
.steps li .i{width:20px;text-align:center}
.steps li.doing{font-weight:700}
.steps li.err{color:var(--bad)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a76,#ff7a59);transition:width .3s}
.lpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lpick label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;font-size:14px;background:#fffdfb;cursor:pointer}
.lpick input{accent-color:var(--pri);width:16px;height:16px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.del{color:var(--bad);font-size:13px;font-weight:600}
.lpick .pg{font-size:12px;color:var(--muted);margin-left:2px}
.lpick .lrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;border:1.5px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;background:#fffdfb}
.lpick .lrow label{border:0;padding:2px 0;background:none}
.lpick .pg.est{color:#c2410c;font-weight:600}
.lpick .pged{border:0;background:#fff1e6;color:#c2410c;border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer}
.lpick .pgform{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0 4px}
.lpick .pgform .inp{width:74px;padding:7px 8px}
.resume{background:linear-gradient(120deg,#fff4e0,#fff);border:1.5px solid #f6cf8f;border-radius:16px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.resume .steps,.resume .progress{flex-basis:100%;margin-top:4px}
.resume .steps:empty{display:none}
.small{font-size:12.5px}
.btn-sm{padding:8px 14px;font-size:14px}
.resume .inp{flex:1;min-width:160px}

@media (max-width:560px){
  .paper{padding:16px 12px;border-radius:14px}
  table.bi td{padding:7px 5px;font-size:14.5px}
  table.bi td.c-zh{font-size:16.5px}
  table.bi col.num{width:20px}
  .doc-title h1{font-size:22px}
  .tab{font-size:14px}
}
@media (max-width:360px){ .tab small,.tab .s2{font-size:10px} }
@media (min-width:760px){ .lesbar{flex-wrap:wrap;overflow:visible} }

@media print{
  @page{size:A4;margin:12mm 11mm}
  html,body{background:#fff}
  body{font-size:11pt}
  .bar,.docs,.tabs,.lesbar,.tools,.noprint,.toast,#upView{display:none!important}
  .wrap{max-width:none;padding:0}
  .paper{box-shadow:none;border-radius:0;padding:0;margin:0}
  .doc-title h1{font-size:18pt}
  .les-h{break-after:avoid;margin-top:14pt}
  .txt-h{break-after:avoid;margin:10pt 0 4pt}
  table.bi tr,.gp,.gex,.fbox{break-inside:avoid}
  table.bi td{padding:3pt 5pt;font-size:10.5pt;line-height:1.45}
  table.bi td.c-zh{font-size:12pt}
  table.bi tr:nth-child(even) td{background:#fbf6f0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .c-write textarea,.pad{display:none!important}
  .c-write .ans,.peek{display:none!important}
  .c-write{height:34pt;border-bottom:1px dotted #bbb}
  .practice-print td.c-write{background:#fff!important}
  .sum th,.fbox,.les-h,.gp-h .no{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gp{margin:8pt 0 10pt}
  .gex .z{font-size:12pt}
}
#runSlot .steps{max-height:150px;overflow:auto;margin:6px 0}
</style>
</head>
<body>
<script src="../shared/nav.js?v=14"></script>
<div class="bar"><div class="in">
  <a class="back" href="./" aria-label="Về trang ra đề">←</a>
  <div><div class="t">Tài liệu ôn</div><div class="s" id="barSub">Dịch song ngữ · Luyện dịch · Ngữ pháp</div></div>
  <button class="printbtn" id="printBtn">🖨 In</button>
</div></div>

<div class="wrap">
  <div class="docs" id="docs"></div>

  <div id="viewer">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="bi">Song ngữ<small>Trung | Việt</small></button>
      <button class="tab" data-tab="lt">Luyện dịch<small>chỉ tiếng Việt</small></button>
      <button class="tab" data-tab="np">Ngữ pháp<small>chung + từng bài</small></button>
      <button class="tab" data-tab="tv">Từ vựng<small>học từ mới</small></button>
    </div>
    <div class="lesbar" id="lesbar"></div>
    <div class="tools" id="tools"></div>
    <div id="resumeBox"></div>
    <div id="out"></div>
  </div>

  <div id="upView" class="hidden">
    <div class="panel">
      <h2>📄 Thêm tài liệu mới</h2>
      <p class="hint" style="margin:0 0 12px">Bỏ file giáo trình vào (PDF, Word, ảnh chụp, hoặc dán chữ). Web sẽ đọc chữ, chia theo bài, rồi nhờ AI dịch và soạn ngữ pháp. Làm xong sẽ được lưu lại trên máy này, lần sau mở ra xem liền.</p>
      <label class="drop" id="drop"><input type="file" id="file" accept=".pdf,.docx,.txt,image/*" multiple hidden><div style="font-size:30px">📥</div><b>Chọn file hoặc kéo thả vào đây</b><span>PDF · Word (.docx) · ảnh chụp (chọn nhiều ảnh được) · .txt</span></label>
      <details style="margin-top:10px"><summary class="hint" style="cursor:pointer">Hoặc dán chữ vào</summary><textarea class="inp" id="paste" rows="6" style="margin-top:8px" placeholder="Dán nội dung bài học (chữ Hán)…"></textarea><button class="btn btn-line" id="usePaste" style="margin-top:8px">Dùng đoạn chữ này</button></details>
      <div id="fileInfo" class="hidden" style="margin-top:14px"></div>
    </div>
    <div class="panel hidden" id="pickPanel">
      <h2>Chọn bài</h2>
      <p class="hint" style="margin:0 0 6px" id="pickHint"></p>
      <div class="lpick" id="lpick"></div>
      <label style="display:block;margin:10px 0 4px" class="hint small">Tên tài liệu</label>
      <input class="inp" id="docName" placeholder="VD: Hán ngữ quyển 5 · Bài 1–10">
      <div id="keyBox" class="hidden" style="margin-top:12px">
        <label class="hint small">Key AI Groq (miễn phí, chỉ cần nhập 1 lần trên máy này)</label>
        <input class="inp" id="keyInp" placeholder="gsk_…" autocomplete="off">
      </div>
      <div class="row" style="margin-top:14px"><button class="btn btn-pri" id="goBtn">✨ Dịch & soạn ngữ pháp</button><button class="btn btn-line" id="cancelBtn">Huỷ</button></div>
      <ul class="steps" id="steps"></ul>
      <div class="progress hidden" id="prog"><i></i></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>window.ONTHI_DOCS=window.ONTHI_DOCS||[];</script>

<script src="data/docs.js?v=2"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2600)}
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}

/* ---------- lưu tài liệu (IndexedDB) ---------- */
var DB=null;
function db(){ return new Promise(function(res,rej){ if(DB) return res(DB); try{ var r=indexedDB.open("ot-docs",2); r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains("docs")) d.createObjectStore("docs",{keyPath:"id"}); if(!d.objectStoreNames.contains("pages")) d.createObjectStore("pages",{keyPath:"k"}); }; r.onsuccess=function(){DB=r.result;res(DB)}; r.onerror=function(){rej(r.error)}; }catch(e){rej(e)} }); }
function dbAll(){ return db().then(function(d){ return new Promise(function(res){ var out=[]; var c=d.transaction("docs").objectStore("docs").openCursor(); c.onsuccess=function(){ var x=c.result; if(x){out.push(x.value);x.continue()} else res(out) }; c.onerror=function(){res(out)}; }); }).catch(function(){return []}); }
var DEAD={}; /* tài liệu đã bị thay bằng gói có sẵn: việc AI cũ đang chạy thì thôi lưu */
function dbPut(doc){ if(DEAD[doc.id]) return Promise.resolve(); return db().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction("docs","readwrite"); t.objectStore("docs").put(doc); t.oncomplete=function(){res()}; t.onerror=function(){rej(t.error)}; }); }); }
function dbDel(id){ return db().then(function(d){ return new Promise(function(res){ var t=d.transaction("docs","readwrite"); t.objectStore("docs").delete(id); t.oncomplete=function(){res()}; }); }); }

var CN={"〇":0,"零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function cnNum(s){ if(/^\d+$/.test(s)) return +s; var n=0,t=0; for(var i=0;i<s.length;i++){ var c=s[i]; if(c==="十"){ n+=(t||1)*10; t=0; } else if(c==="百"){ n+=(t||1)*100; t=0; } else if(CN[c]!=null) t=CN[c]; } return n+t; }

/* tên bài AI trả về có "第十三课 | …" → lấy đúng số bài của sách, bỏ phần số khỏi tên cho khỏi lặp */
function fixLes(l){ if(!l) return l; var zh=String(l.zh||""), n=lessonNums(zh)[0]||0;
  if(n&&n!==l.n) l.n=n;
  l.zh=zh.replace(/^\s*第\s*\S{1,4}?\s*(?:[课課]|单元)\s*[|｜·:：\-—–]*\s*/,"").trim()||zh;
  l.vi=String(l.vi||"").replace(/^\s*(?:Bài|Lesson|Unit)\s*\d+\s*[|｜·:：\-—–]*\s*/i,"").trim()||l.vi; return l; }
function loadDocs(){
  return dbAll().then(function(saved){
    saved.forEach(function(d){ if(d.lessons){ d.lessons.forEach(fixLes); d.lessons.sort(function(a,b){return a.n-b.n}); } });
    saved.sort(function(a,b){return (b.created||0)-(a.created||0)});
    DOCS=window.ONTHI_DOCS.concat(saved);
    var id=ls("tl.doc"); cur=DOCS.filter(function(d){return d.id===id})[0]||DOCS[0]||null;
    drawDocs(); if(cur) openDoc(cur); else showUpload();
  });
}

}

function lcsN(a,b){ var prev=new Array(b.length+1).fill(0),cur; for(var i=1;i<=a.length;i++){ cur=new Array(b.length+1).fill(0); for(var j=1;j<=b.length;j++) cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]); prev=cur; } return prev[b.length]; }

/* ---------- từ vựng: bảng từ · thẻ lật · trắc nghiệm, có đọc to ---------- */
var VK={"名":"danh từ","动":"động từ","形":"tính từ","副":"phó từ","连":"liên từ","介":"giới từ","量":"lượng từ","助":"trợ từ","代":"đại từ","数":"số từ","专名":"tên riêng"};
function vkind(k){ return String(k||"").split("、").map(function(x){return VK[x]||x}).join(", "); }
var VM=ls("tl.vmode")||"list", VS={i:0,show:false,order:null,q:null,score:0,done:0,key:""};
function vocabList(L){ var out=[]; L.forEach(function(l){ (l.vocab||[]).forEach(function(v){ out.push({z:v[0],p:v[1],k:v[2],m:v[3],n:l.n}); }); }); return out; }

  var vs=speechSynthesis.getVoices().filter(function(v){return /^zh(-|_)?(CN|Hans)?/i.test(v.lang)}); if(vs.length) u.voice=vs.filter(function(v){return /CN/i.test(v.lang)})[0]||vs[0]; speechSynthesis.speak(u); }catch(e){} }
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function vocabHTML(L,sub){

  var key=cur.id+"|"+sel.join(","); if(VS.key!==key){ VS={i:0,show:false,order:null,q:null,score:0,done:0,key:key}; }

      h+='<table class="vt"><tbody>'+l.vocab.map(function(v,i){ return '<tr><td class="vn">'+(i+1)+'</td><td class="vz zh">'+esc(v[0])+'<button class="say" data-say="'+esc(v[0])+'" aria-label="Nghe">🔊</button></td><td><div class="vp">'+esc(v[1])+'</div><div class="vk">'+esc(vkind(v[2]))+'</div></td><td class="vm">'+esc(v[3])+'</td></tr>'; }).join("")+'</tbody></table>'; });
    return h;

    h+='<div class="fcnav"><button data-fc="-1">◀</button><button class="say" style="width:46px;height:46px;font-size:20px" data-say="'+esc(w.z)+'">🔊</button><span class="c">'+(VS.i%V.length+1)+' / '+V.length+'</span><button data-fc="1">▶</button></div><div class="fcnav"><button data-fc="mix">🔀 Trộn lại</button></div>';
    return h; }

    '<div class="qscore">Đúng '+VS.score+' / '+VS.done+' câu</div>'+(q.ans!=null?'<div class="fcnav"><button data-qn>Câu tiếp ▶</button></div>':'')+'</div>';
  return h;
}

        return runAll(s.pages,readHead,poolSize()+1).then(function(hs){ s.heads=hs; mark(i,"○","đã đọc chữ, chờ AI"); });
      });
  }
  function savePending(){ doc.pending=segs.filter(function(s){return !s.fin}).map(function(s){ var x={n:s.n,head:s.head,text:s.text||""}; if(!s.text&&s.pages){ x.pages=s.pages; x.fkey=s.fkey||FKEY; } return x; }); ls("tl.doc",doc.id); return dbPut(doc); }
  var manual=segs.some(function(s){return s.n===0&&!s.text&&s.pages});
  var p1;
  if(manual){
    // trang tự nhập: đọc hết rồi tự chia bài
    p1=needOcr.reduce(function(pr,s){ return pr.then(function(){ return ocrOne(s,segs.indexOf(s)); }); },Promise.resolve()).then(function(){
      var out=[]; segs.forEach(function(s){
        if(s.n===0&&s.heads){ var groups=[], g=null;
          s.pages.forEach(function(pg,k){ var h=headInfo(s.heads[k]); if(h&&h.n&&!groups.some(function(x){return x.n===h.n})){ g={n:h.n,head:h.title,t:[]}; groups.push(g); } if(!g){ g={n:0,head:s.head,t:[]}; groups.push(g); } g.t.push(s.ptext[k]); });
          groups.forEach(function(x){ out.push({n:x.n,head:x.head,text:x.t.join("\n")}); }); return; }
        out.push({n:s.n,head:s.head,text:s.text}); });
      if(out.length!==segs.length){ segs=out; draw(); units=done+segs.length*2; }
      return savePending();
    });
  } else p1=savePending();
  // đọc chữ bài này trong lúc AI làm bài trước (đọc chữ lần lượt từng bài cho nhẹ máy; AI 2 bài cùng lúc,
  // mỗi bài dịch + soạn ngữ pháp song song; bộ điều phối tự chia lượt cho các model AI). Xong bài nào lưu bài đó.
  var ocrQ=Promise.resolve();
  function ensureText(s,i){
    if(s.text||!s.pages) return Promise.resolve(true);
    if(!PDF||(s.fkey&&s.fkey!==FKEY)){ mark(i,"⚠","cần chọn lại file sách (＋ Thêm tài liệu) để đọc tiếp — trang đã đọc được lưu nên rất nhanh"); return Promise.resolve(false); }
    var p=ocrQ.then(function(){ return ocrOne(s,i); }).then(function(){ return savePending(); }).then(function(){ return true; });
    ocrQ=p.catch(function(){}); return p;
  }
  return p1.then(function(){ return runAll(segs,function(s){ var i=segs.indexOf(s);
    return ensureText(s,i).then(function(ok){ if(!ok) return;
    var wait=function(sec,why){ mark(i,"⏳",(why==="net"?"mạng chập chờn, thử lại sau "+Math.round(sec)+" giây…":"đang xếp lượt AI miễn phí (~"+Math.round(sec)+" giây)…"),"doing"); };
    var keep=function(){ mark(i,"✱","AI đang dịch bài khóa + soạn ngữ pháp…","doing"); };
    keep();
    var les={n:s.n>0?s.n:0,zh:"",vi:"",texts:[],grammar:[]};
    return Promise.all([aiTranslate(s,wait).then(function(t){ keep(); tick(1); return t; }),aiGrammar(s,wait).then(function(g){ keep(); tick(1); return g; })])
      .then(function(r){ var t=r[0], g=r[1]; les.zh=t.title_zh||String(s.head||"").replace(/^第\s*\S+?[课課]\s*/,""); les.vi=t.title_vi; les.texts=t.sections;
        fixLes(les); /* số bài theo đúng tiêu đề 第N课 trong sách */
        if(les.n!==s.n){ s.n=les.n; }
        les.grammar=g; s.fin=true;
        doc.lessons=doc.lessons.filter(function(l){return !(l.n===les.n&&les.n>0)}).concat([les]).sort(function(a,b){return a.n-b.n});
        return savePending().then(function(){ mark(i,"✓",les.texts.reduce(function(a,t){return a+t.pairs.length},0)+" câu · "+g.length+" điểm ngữ pháp"); try{ live(); }catch(e){} });
      });
    });
  },3); })
  .then(function(){ busy(false); unrun(); if(DEAD[doc.id]) return; if(!(doc.pending&&doc.pending.length)) delete doc.pending; return dbPut(doc).then(function(){ btns.forEach(function(b){b.disabled=false}); if(doc.pending){ toast("Còn "+doc.pending.length+" bài cần chọn lại file sách"); onFinish(false,new Error("cần chọn lại file sách để đọc tiếp")); } else { toast("Xong rồi! Đã lưu tài liệu"); onFinish(true); } }); })
  .catch(function(e){
    busy(false); unrun(); btns.forEach(function(b){b.disabled=false});
    var li=steps.querySelector("li.doing"); if(li){ li.className="err"; li.firstChild.textContent="✗"; li.lastChild.textContent+=" → "+e.message; } else toast(e.message);
    if(/Key/.test(e.message)){ ls("bb.groq",null); var kb=$("#keyBox"); if(kb) kb.classList.remove("hidden"); }
    onFinish(false,e);
  });
}
$("#goBtn").onclick=function(){
  var ki=$("#keyInp").value.trim(); if(ki) ls("bb.groq",ki);
  if(!groqKey()){ $("#keyBox").classList.remove("hidden"); $("#keyInp").focus(); toast("Cần key AI Groq để dịch, nhập 1 lần là xong"); return; }
  var picked=pickedSegs().map(function(s){return {n:s.n,head:s.head,text:s.text,pages:s.pages,fkey:FKEY}});
  if(!picked.length){ toast("Chọn ít nhất 1 bài"); return; }
  if(picked.some(function(s){return !s.text&&s.pages})&&!PDF){ toast("Chọn lại file sách nha"); return; }
  SCAN_ID++;
  var doc={id:"u"+Date.now(),name:$("#docName").value.trim()||RAW.name,created:Date.now(),lessons:[]};
  runJob(doc,picked,{id:"st",steps:$("#steps"),prog:$("#prog"),btns:[$("#goBtn"),$("#cancelBtn")]},function(ok,e){
    if(ok){ $("#pickPanel").classList.add("hidden"); $("#fileInfo").classList.add("hidden"); RAW=null; ls("tl.doc",doc.id); if(cur&&cur.id===doc.id&&$("#upView").classList.contains("hidden")) refreshCur(doc); else loadDocs(); }
    else if(doc.pending&&doc.pending.length){ /* đã lưu phần làm xong → mở tài liệu, có nút “Làm tiếp” */
      setTimeout(function(){ $("#pickPanel").classList.add("hidden"); $("#fileInfo").classList.add("hidden"); ls("tl.doc",doc.id); loadDocs().then(function(){ var r=$("#resume"); if(r){ var m=document.createElement("div"); m.className="del"; m.style.flexBasis="100%"; m.textContent="Lần trước dừng vì: "+e.message; r.appendChild(m); } }); },1800);
    }
  });
};
/* làm tiếp tài liệu còn dở */
var RUN={}; /* tài liệu đang làm dở trong lúc mở xem */
function refreshCur(d){ var y=window.scrollY; DOCS=DOCS.map(function(x){return x.id===d.id?d:x}); cur=d; if(!ls("tl.sel."+d.id)) sel=d.lessons.map(function(l){return l.n}); $("#resumeBox").innerHTML=resumeHTML(d); attachRun(); drawDocs(); drawTabs(); render(); window.scrollTo(0,y); }
function attachRun(){ var r=cur&&RUN[cur.id], slot=$("#runSlot"); if(r&&slot){ slot.appendChild(r.steps); slot.appendChild(r.prog); } }
function resumeHTML(d){ if(RUN[d.id]) return '<div class="resume" id="resume"><div><b>⏳ Đang làm các bài còn lại…</b> <span class="hint small">bài nào xong tự hiện thêm bên dưới, cứ học trước nha</span></div><div id="runSlot"></div></div>';
  var p=d.pending||[]; if(!p.length) return ''; return '<div class="resume" id="resume"><div><b>⏳ Còn '+p.length+' bài chưa xong</b> <span class="hint small">('+esc(p.map(segLabel).join(", "))+')</span></div>'+(groqKey()?'':'<input class="inp" id="rkey" placeholder="Dán key AI Groq (gsk_…)" autocomplete="off">')+'<button class="btn btn-pri btn-sm" id="resumeBtn">▶ Làm tiếp</button><ul class="steps" id="rsteps"></ul><div class="progress hidden" id="rprog2"><i></i></div></div>'; }
document.addEventListener("click",function(e){
  if(!e.target.closest||!e.target.closest("#resumeBtn")) return;
  var rk=$("#rkey"); if(rk&&rk.value.trim()) ls("bb.groq",rk.value.trim());
  if(!groqKey()){ if(rk) rk.focus(); toast("Cần key AI Groq để dịch, nhập 1 lần là xong"); return; }
  if(rk) rk.remove();
  var d=cur; runJob(d,d.pending.slice(),{id:"rs",steps:$("#rsteps"),prog:$("#rprog2"),btns:[$("#resumeBtn")]},function(ok,e){ var keep=d.id; dbAll().then(function(s){ DOCS=window.ONTHI_DOCS.concat(s.sort(function(a,b){return (b.created||0)-(a.created||0)})); var nd=DOCS.filter(function(x){return x.id===keep})[0]; if(nd&&cur&&cur.id===keep) refreshCur(nd); else if(nd) openDoc(nd); var r=$("#resume"); if(!ok&&e&&r){ var m=document.createElement("div"); m.className="del"; m.style.flexBasis="100%"; m.textContent="Lần trước dừng vì: "+e.message; r.appendChild(m); } }); });
});

window.__tl={docs:function(){return DOCS},segs:function(){return SEGS},head:function(t){return headInfo(t)}};
initPacks().then(loadDocs);
})();
</script>
