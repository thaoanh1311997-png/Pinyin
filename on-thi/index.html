<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../shared/nav-head.js?v=17"></script>
<title>Ra đề ôn thi</title>
<meta name="theme-color" content="#fff7ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ef; --card:#ffffff; --ink:#2b2622; --muted:#7a6f66; --line:#efe3d6;
  --pri:#ff7a59; --pri2:#ffb199; --pri-ink:#fff; --soft:#fff0e8;
  --teal:#1fa39a; --teal-soft:#e3f6f3; --blue:#3b7ddd; --blue-soft:#e8f0fd;
  --ok:#1f9d55; --ok-soft:#e5f6ec; --bad:#e0483e; --bad-soft:#fde9e7; --warn:#d98a00; --warn-soft:#fff4dc;
  --r:18px; --shadow:0 2px 0 rgba(120,80,40,.06),0 6px 20px rgba(120,80,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
.zh,.zh *{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.py{font-family:Inter,system-ui,sans-serif;color:var(--muted);font-size:14px}
h1,h2,h3,.baloo{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.hidden{display:none!important}

/* top */
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.banner{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,#ff8a65 0%,#ff6f61 45%,#f0568c 100%);box-shadow:0 10px 24px rgba(240,86,100,.25)}
.banner::after{content:"学";position:absolute;right:-8px;bottom:-34px;font-family:"Noto Sans SC";font-weight:700;font-size:130px;opacity:.13;line-height:1}
.banner .hi{font-size:14px;opacity:.92}
.banner .big{font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:1.15;margin:2px 0 10px}
.banner .stats{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.banner .st{background:rgba(255,255,255,.2);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.25}
.banner .st b{display:block;font-family:"Baloo 2";font-size:19px}
.exam-card{position:relative;overflow:hidden}
.exam-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc,var(--pri))}
.exam-card.teal{--acc:var(--teal)} .exam-card.teal .ico{background:var(--teal-soft)} .exam-card.teal .btn-pri{background:var(--teal);box-shadow:0 3px 0 #16807a}
.exam-card.blue{--acc:var(--blue)} .exam-card.blue .ico{background:var(--blue-soft)} .exam-card.blue .btn-pri{background:var(--blue);box-shadow:0 3px 0 #2a64b8}
.bankinfo{margin-top:16px;font-size:13px;color:var(--muted)}
.bankinfo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bankinfo .chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.done .tiles{display:none}
.answer-line.r{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.answer-line.w{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.answer-line.r .tile,.answer-line.w .tile{background:#fff;border-color:transparent}
.yours-sx:empty{display:none}
.sec-edit{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fffdfb}
.sec-edit select{width:calc(100% - 42px);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:15px;font-weight:600}
.sec-edit .nums{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.sec-edit .nums input{width:60px;border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:15px;color:var(--ink)}
.sec-edit .nums .sub{font-weight:700;color:var(--ink)}
.sec-edit .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:700}
.sec-edit .bank{font-size:12px;color:var(--muted);margin-top:4px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ffb199,#ff7a59);display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow);flex:none}
.hero h1{font-size:28px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.setpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.exam-card{display:flex;flex-direction:column;gap:12px}
.exam-card .top{display:flex;align-items:center;gap:12px}
.exam-card .ico{font-size:30px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--soft);flex:none}
.exam-card h2{font-size:22px}
.exam-card .meta{color:var(--muted);font-size:14px}
.count{margin-left:auto;text-align:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;line-height:1.2;flex:none}
.count b{display:block;font-size:20px;font-family:"Baloo 2"}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec-pill{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:#5a4f46}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 3px 0 #e35d3c}
.btn-ghost{background:var(--soft);color:#c4502f}
.btn-line{background:var(--card);border:1.5px solid var(--line)}
.btn-ok{background:var(--teal);color:#fff;box-shadow:0 3px 0 #16807a}
.btn-sm{padding:8px 12px;font-size:14px;border-radius:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.hint{color:var(--muted);font-size:14px}
.small{font-size:13px}
.history{font-size:14px}
.history .h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.history .h:last-child{border:0}
.history .hbtn{width:100%;background:none;border:0;border-bottom:1px dashed var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:center;gap:8px;border-radius:0}
.history .hbtn:hover{background:var(--soft)}
.history .hbtn .go{display:inline-block;margin-left:8px;font-size:13px;color:var(--pri,#ff7a59);font-weight:700}
.history .hbtn.old{cursor:default}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* exam */
.bar{position:sticky;top:0;z-index:10;background:rgba(255,247,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar .t{font-weight:700;font-size:16px;line-height:1.2}
.bar .s{font-size:12px;color:var(--muted)}
.timer{margin-left:auto;font-family:Inter;font-weight:500;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex:none}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}

.sec-h{display:flex;align-items:baseline;gap:8px;margin:26px 2px 10px}
.sec-h h3{font-size:20px}
.sec-h .pts{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.q{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 16px;margin-bottom:12px;border:2px solid transparent}
.q .n{font-family:"Baloo 2";font-weight:800;color:var(--pri);margin-right:6px}
.q .stem{font-size:20px;line-height:1.7}
.q .vi{font-size:16px}
.q .stem.para{font-size:17px;line-height:1.75}
.q .stem.zh.para{font-size:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts.long{grid-template-columns:1fr}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fffdfb;font-size:18px;line-height:1.45}
.opt .l{font-family:Inter;font-weight:500;font-size:13px;color:var(--muted);width:20px;height:20px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none;margin-top:3px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .l{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.q.is-ok{border-color:#bfe8cf}
.q.is-bad{border-color:#f6c6c1}
.q.is-half{border-color:#f5dc9e}

.blank{display:inline-block;width:3.6em;border:0;border-bottom:2px solid var(--pri);background:var(--soft);border-radius:6px 6px 0 0;padding:0 6px;text-align:center;font-size:20px;font-family:"Noto Sans SC",sans-serif;margin:0 2px;outline:none}
.blank:focus{background:#ffe2d6}
.blank.r{border-color:var(--ok);background:var(--ok-soft)}
.blank.w{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}

.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{padding:8px 12px;border-radius:11px;background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-size:19px}
.tile.used{opacity:.25;pointer-events:none}
.answer-line{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;background:#fffdfb}
.answer-line:empty::before{content:"Chạm các mảnh bên dưới để ghép câu";color:#b9aca0;font-size:14px;padding-left:6px;font-family:"Be Vietnam Pro"}
.answer-line .tile{background:var(--blue-soft);border-color:#c9dbf8;box-shadow:none}
textarea.ans{width:100%;min-height:64px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;line-height:1.6;background:#fffdfb;resize:vertical;outline:none}
textarea.ans:focus{border-color:var(--pri)}
textarea.ans.para{min-height:150px}
.zh-in{font-family:"Noto Sans SC",sans-serif}

.key{margin-top:12px;padding:12px;border-radius:12px;background:var(--teal-soft);font-size:16px}
.key .lab{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.key .z{font-size:19px;line-height:1.7}
.key .note{margin-top:6px;font-size:14px;color:#355e5a}
.yours{margin-top:10px;font-size:15px;color:var(--muted)}
.yours b{color:var(--ink);font-weight:500}
.grade{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.grade button{flex:1;min-width:84px;padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff}
.grade button.on.g1{background:var(--ok);border-color:var(--ok);color:#fff}
.grade button.on.g5{background:var(--warn);border-color:var(--warn);color:#fff}
.grade button.on.g0{background:var(--bad);border-color:var(--bad);color:#fff}
.src{display:block;text-align:right;font-size:11px;color:#b9aca0;margin:-6px 0 2px;line-height:1.3}
.rev{display:none}
.done .rev{display:block}
.done .grade.rev{display:flex}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,247,239,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .btn{flex:1;white-space:nowrap;padding-left:10px;padding-right:10px}

.score{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:28px;line-height:1}
.ring small{display:block;font-size:12px;color:var(--muted);font-family:"Be Vietnam Pro";font-weight:500}
.brk{font-size:14px;width:100%}
.brk div{display:flex;justify-content:space-between;padding:3px 0}
.pending{color:var(--warn);font-weight:600}

/* editor */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdfb;outline:none;font-size:16px}
.inp:focus{border-color:var(--pri)}
.total{font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc-card{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:linear-gradient(120deg,#fff8ec,#fff 60%);border-left:5px solid #f2a33a}
.doc-card .ico{font-size:30px;width:52px;height:52px;border-radius:16px;background:#fde9c8;display:grid;place-items:center;flex:none}
.doc-card h2{font-size:19px;margin:0}.doc-card .meta{font-size:13px;color:var(--muted)}.doc-card .dc-t{flex:1;min-width:0}
.doc-card .dc-go{font-size:30px;color:#e0912a;font-weight:700}
.np-card{background:linear-gradient(120deg,#eef4ff,#fff 60%);border-left-color:#2f6fd0}.np-card .ico{background:#dbe7fb}.np-card .dc-go{color:#2f6fd0}
.row2 .btn{padding:13px 8px;font-size:15px}
.exp{margin-top:12px;padding:12px 12px 10px;border-radius:12px;background:var(--warn-soft);font-size:15px;line-height:1.6}
.exp.exp-ok{background:#f4f8f3}
.exp .lab{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.exp.exp-ok .lab{color:var(--ok)}
.exp p{margin:4px 0}
.exp .zh{font-size:17px}
.exp .vi-line{color:#5a4f46;font-style:italic}
.exp .tip{color:var(--muted);font-size:14px}
.exp .miss{color:var(--bad);font-weight:600}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad);text-decoration:line-through}
.olist{list-style:none;padding:0;margin:6px 0 0}
.olist li{display:flex;gap:8px;padding:5px 0;border-top:1px dashed #f0dcb4}
.olist li:first-child{border-top:0}
.olist .mk{width:18px;flex:none;font-weight:700;color:var(--muted)}
.olist li.ok .mk{color:var(--ok)} .olist li.bad .mk{color:var(--bad)}
.olist i{color:var(--bad);font-style:normal;font-size:13px}
.cmp{background:#fff;border-radius:10px;padding:8px 10px;margin:6px 0}
.cmp>div{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.lab2{font-size:12px;color:var(--muted);width:62px;flex:none}
mark{background:#ffd3cc;color:#b42318;border-radius:3px;padding:0 1px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipbtn{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none}
.chipbtn.ask{background:#2b2622;color:#fff;border-color:#2b2622}
.regrade{margin-top:8px;font-size:13px;color:var(--muted)}
.regrade .grade{margin-top:4px}
.regrade .grade button{padding:6px 4px;font-size:13px;min-width:70px}
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(40,30,20,.45)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:86vh;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;max-width:720px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px;z-index:2}
.sheet-body{overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.cd-les{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.05em}
.cd-t{font-size:22px;margin:4px 44px 12px 0}
.formula{background:#fff3df;border:1px solid #f3dcb3;border-radius:12px;padding:10px 12px;font-weight:600;color:#7a4a12;font-size:15px;line-height:1.7}
.cd-sub{font-family:"Baloo 2";font-weight:700;font-size:17px;margin:16px 0 6px}
.cd-sub.warn{color:var(--bad)}
.ex{background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.ex .zh{font-size:18px}
.exvi{color:var(--muted);font-size:14px;font-style:italic}
.warnp{background:var(--bad-soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}
.book-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:15px;font-weight:500}

.only-wrong .q.is-ok,.only-wrong .sec-h.allok{display:none}
.filter{display:flex;gap:6px;margin-top:12px}
.filter button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff}
.filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
details summary{cursor:pointer;font-weight:600}
@media (max-width:420px){
  .opts{grid-template-columns:1fr 1fr}
  .q .stem{font-size:19px}
  .hero h1{font-size:25px}
}
</style>
</head>
<body>
<script src="../shared/nav.js?v=17"></script>
<div id="home" class="wrap"></div>
<div id="examView" class="hidden"></div>
<div id="editView" class="hidden"></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="sheet-bg" data-close></div><div class="sheet-card"><button class="sheet-x" data-close>✕</button><div class="sheet-body" id="sheetBody"></div></div></div>

<script>window.ONTHI_SETS = window.ONTHI_SETS || [];</script>
<!--DATA-->
<script src="data/sets.js"></script>
<script>
(function(){
"use strict";
var TYPES = {
  mcq:{name:"Trắc nghiệm", long:"Chọn đáp án đúng", auto:true},
  sx: {name:"Sắp xếp câu", long:"Sắp xếp thành câu hoàn chỉnh", auto:true},
  ss: {name:"Sửa câu sai", long:"Sửa câu sai", auto:false},
  dt: {name:"Điền trống", long:"Điền từ thích hợp vào chỗ trống", auto:true},
  tv: {name:"Dịch câu Trung → Việt", long:"Dịch câu Trung → Việt", auto:false},
  tvd:{name:"Dịch đoạn Trung → Việt", long:"Dịch đoạn văn Trung → Việt", auto:false},
  vt: {name:"Dịch câu Việt → Trung", long:"Dịch câu Việt → Trung", auto:false},

};

/* ---------- PICK QUESTIONS ---------- */
function pick(type,n){
  var bank=curSet.banks[type]||[]; var key="seen."+curSet.id+"."+type;
  var seen=store(key)||[]; var seenSet={}; seen.forEach(function(i){seenSet[i]=1});
  var idx=bank.map(function(_,i){return i});
  var fresh=shuffle(idx.filter(function(i){return !seenSet[i]}));
  var chosen=fresh.slice(0,n);
  if(chosen.length<n){ seen=[]; var rest=shuffle(idx.filter(function(i){return chosen.indexOf(i)<0})); chosen=chosen.concat(rest.slice(0,n-chosen.length)); }
  store(key,seen.concat(chosen));
  return chosen.map(function(i){return bank[i]});
}

function startExam(st){
  exam={st:st,start:Date.now(),done:false,secs:[]};
  st.sections.forEach(function(s){
    var items=pick(s.type,s.n).map(function(it){
      var q={type:s.type,it:it,pts:s.pts,user:null,grade:null};
      if(s.type==="mcq"){ var order=shuffle([0,1,2,3].slice(0,it.o.length)); q.order=order; }
      if(s.type==="sx"){ var p; var k=0; do{p=shuffle(it.p.map(function(x,i){return i}));k++}while(k<6&&p.join()===it.p.map(function(x,i){return i}).join()); q.order=p; q.user=[]; }
      return q;
    });
    exam.secs.push({s:s,items:items});
  });
  renderExam(); saveCur(true);
}

/* ---------- GRADING ---------- */
function autoGrade(q){
  var it=q.it;
  if(q.type==="mcq") return q.user===it.a?1:0;
  if(q.type==="sx") return norm(q.user.map(function(i){return it.p[i]}).join(""))===norm(it.a)?1:0;
  if(q.type==="dt"){ var u=norm(q.user); return it.a.some(function(a){return norm(a)===u})&&u?1:0; }
  if(q.type==="ss"){ var u2=norm(q.user); if(!u2) return 0; return it.a.split("/").some(function(a){return norm(a)===u2})?1:0; }
  if(!q.user||!String(q.user).trim()){ q.sim=0; return 0; }
  return transGrade(q);
}
/* chấm dịch tự động: so với bản mẫu */
var MARKERS=["越来越","起来","出来","下来","下去","只有","只要","一边","不了","不下","不动","不起","把","被","着","连","越"];
function lcs(a,b){ var m=a.length,n=b.length,prev=new Array(n+1).fill(0),cur; for(var i=1;i<=m;i++){cur=new Array(n+1).fill(0);for(var j=1;j<=n;j++){cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);}prev=cur;} return prev[n]; }
function viTokens(s){ return String(s).toLowerCase().normalize("NFC").replace(/[^0-9a-zà-ỹđ\s]/g," ").split(/\s+/).filter(Boolean); }
function similarity(user,ref,toVi){
  if(toVi){ var u=viTokens(user), r=viTokens(ref); if(!u.length||!r.length) return 0;
    var sc=function(U,R){ var cnt={},hit=0; R.forEach(function(w){cnt[w]=(cnt[w]||0)+1}); U.forEach(function(w){if(cnt[w]){hit++;cnt[w]--}}); return 0.3*hit/U.length+0.7*hit/R.length; };
    var strip=function(a){ return a.map(function(w){ return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d"); }); };
    return Math.max(sc(u,r), 0.9*sc(strip(u),strip(r))); /* gõ không dấu vẫn được tính, trừ nhẹ */ }
  var a=norm(user), b=norm(ref); if(!a||!b) return 0; var l=lcs(a,b); return 0.3*l/a.length+0.7*l/b.length;
}
function transGrade(q){
  var it=q.it, toVi=q.type==="tv"||q.type==="tvd", para=q.type==="tvd"||q.type==="vtd";
  var ref=toVi?it.vi:it.zh, f=similarity(q.user,ref,toVi); q.sim=f;
  var missing=[]; if(!toVi){ var u=norm(q.user), r=norm(ref), used=""; MARKERS.forEach(function(m){ if(r.indexOf(m)>=0 && used.indexOf(m)<0 && u.indexOf(m)<0){ missing.push(m); used+=m; } }); }
  q.missing=missing;
  var hi=toVi?0.78:0.85, lo=toVi?0.5:0.6, g;
  if(!para){ g=f>=hi?1:f>=lo?0.5:0; if(missing.length&&g>0.5) g=0.5; }
  else { var a=0.4; g=Math.max(0,Math.min(1,(f-a)/(hi-a))); g=Math.max(0,Math.round(g*4-0.2)/4); g=Math.max(0,g-0.25*missing.length); }
  return g;
}
function submit(){

function renderScore(save){
  var got=0,total=0,pend=0,rows=[];

    sec.items.forEach(function(q){ t+=q.pts; if(q.grade==null)p++; else {g+=q.grade*q.pts; if(q.grade===1)right++;} });
    got+=g; total+=t; pend+=p;

function cardById(id){ return (curSet.cards||[]).filter(function(c){return c.id===id})[0]; }

function gradeLabel(q){ return q.grade===1?"Đúng":q.grade===0?"Sai":fmt(q.grade*q.pts)+"/"+fmt(q.pts)+"đ"; }
function diffMarks(a,b){ /* đánh dấu ký tự của a không nằm trong LCS với b */
  var m=a.length,n=b.length,T=[]; for(var i=0;i<=m;i++){T.push(new Array(n+1).fill(0));}
  for(i=1;i<=m;i++)for(var j=1;j<=n;j++)T[i][j]=a[i-1]===b[j-1]?T[i-1][j-1]+1:Math.max(T[i-1][j],T[i][j-1]);
  var keep=new Array(m).fill(false); i=m;j=n; while(i>0&&j>0){ if(a[i-1]===b[j-1]){keep[i-1]=true;i--;j--;} else if(T[i-1][j]>=T[i][j-1]) i--; else j--; }
  return a.split("").map(function(ch,k){return keep[k]||/[\s，。！？、；：“”"…]/.test(ch)?esc(ch):'<mark>'+esc(ch)+'</mark>'}).join("");
}
function bestAns(q){ var u=norm(q.user), best=q.it.a.split("/")[0].trim(), bs=-1; q.it.a.split("/").forEach(function(a){a=a.trim(); var s=lcs(u,norm(a)); if(s>bs){bs=s;best=a}}); return best; }

    var t=e.target.closest("button"); if(!t) return; var a=t.dataset.e; readDraft();
    if(a==="back") renderHome();
    else if(a==="add"){ draft.sections.push({type:"dt",n:5,pts:0.2}); drawEditor(); }
    else if(a==="del"){ draft.sections.splice(+t.dataset.i,1); drawEditor(); }
    else if(a==="parse"){ var r=parseStructure($("#pasteBox").value); if(r.length){ draft.sections=r; drawEditor(); toast("Đã đọc được "+r.length+" phần, kiểm tra lại số câu và điểm nha"); } else { $("#parseMsg").textContent="Chưa đọc được, thử ghi rõ tên dạng câu và số câu."; } }
    else if(a==="save"){ if(!draft.sections.length){toast("Thêm ít nhất 1 phần");return} saveDraft(); startExam(draft); }
    else if(a==="remove"){ var c=(store("custom."+curSet.id)||[]).filter(function(s){return s.uid!==draft.uid}); store("custom."+curSet.id,c); renderHome(); }
  };
  v.onchange=function(e){ if(e.target.dataset.k==="type"){ readDraft(); drawEditor(); } };
  v.oninput=function(e){ var rw=e.target.closest(".sec-row"); if(rw){ readDraft(); var ss=draft.sections[+rw.dataset.i]; var sb=rw.querySelector(".sub"); if(sb&&ss) sb.textContent=fmt(ss.n*ss.pts)+"đ"; var tt=sum(draft.sections.map(function(s){return (+s.n||0)*(+s.pts||0)})); var el=v.querySelector(".total"); if(el) el.textContent=fmt(tt);} };
}
function readDraft(){
  var v=$("#editView"); var nm=$("#stName",v); if(!nm) return;
  draft.name=nm.value.trim()||"Đề của tôi"; draft.date=$("#stDate",v).value; draft.min=+$("#stMin",v).value||0;
  v.querySelectorAll(".sec-row").forEach(function(r){ var s=draft.sections[+r.dataset.i]; if(!s) return;
    s.type=r.querySelector('[data-k="type"]').value; s.n=Math.max(1,parseInt(r.querySelector('[data-k="n"]').value)||1); s.pts=parseFloat(String(r.querySelector('[data-k="pts"]').value).replace(",","."))||0; });
}
function saveDraft(){
  var c=store("custom."+curSet.id)||[]; var i=-1; c.forEach(function(s,k){if(s.uid===draft.uid)i=k});
  if(i>=0)c[i]=draft; else c.push(draft); store("custom."+curSet.id,c);
}
function parseStructure(text){
  var out=[], lines=String(text).split(/\n|;/);
  function num(s){return parseFloat(String(s).replace(",","."))}
  lines.forEach(function(l){
    var low=l.toLowerCase(); if(!low.trim()) return;
    var n=null,p=null,tot=null,m;
    m=low.match(/(\d+)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/); if(m){n=+m[1];p=num(m[2]);}
    m=low.match(/=\s*(\d+(?:[.,]\d+)?)\s*(?:điểm|đ)/); if(m) tot=num(m[1]);
    if(n==null){ m=low.match(/(\d+)\s*(?:câu|bài|chỗ|từ)/); if(m) n=+m[1]; }
    function add(type,nn,pp){ if(!nn) return; out.push({type:type,n:nn,pts:pp!=null?pp:null}); }
    var tvDir=/trung\s*[-–—>→]+\s*việt|trung sang việt|trung-việt/.test(low), vtDir=/việt\s*[-–—>→]+\s*trung|việt sang trung|việt-trung/.test(low);
    if(tvDir||vtDir){
      var c=low.match(/(\d+)\s*câu/), d=low.match(/(\d+)\s*đoạn/);
      if(c) add(tvDir?"tv":"vt",+c[1],null);
      if(d) add(tvDir?"tvd":"vtd",+d[1],null);
      return;
    }
    var type=null;
    if(/trắc nghiệm|chọn đáp án|chọn câu|abcd|选择/.test(low)) type="mcq";
    else if(/sắp xếp|排列|连词成句/.test(low)) type="sx";
    else if(/sửa câu|sửa lỗi|câu sai|改错|改病句/.test(low)) type="ss";
    else if(/điền|填空/.test(low)) type="dt";
    else if(/dịch đoạn/.test(low)) type="tvd";
    else if(/dịch/.test(low)) type="tv";
    if(type&&n){ if(tot!=null&&(p==null||Math.abs(n*p-tot)>0.01)) p=Math.round(tot/n*100)/100; add(type,n,p); }
  });
  // chia điểm còn lại cho những phần chưa có điểm, tổng 10
  var known=sum(out.filter(function(s){return s.pts!=null}).map(function(s){return s.n*s.pts}));
  var unk=out.filter(function(s){return s.pts==null});
  if(unk.length){
    var W=function(s){return (s.type==="tvd"||s.type==="vtd")?5:1};
    var rest=Math.max(0,10-known), wsum=sum(unk.map(function(s){return W(s)*s.n}))||1;
    unk.forEach(function(s){s.pts=Math.round(rest*W(s)/wsum*100)/100});
  }
  return out.filter(function(s){return curSet.banks[s.type]&&curSet.banks[s.type].length});
}

  $("#sheet").addEventListener("click",function(e){ if(e.target.closest("[data-close]")) closeSheet(); var c=e.target.closest("[data-card]"); if(c) openCard(c.dataset.card); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });
}
if(SETS.length) boot(); else window.addEventListener("load",boot);
})();
