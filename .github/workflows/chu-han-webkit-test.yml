name: Kiểm tra Soi chữ Hán trên WebKit (Safari)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i --no-save playwright && npx playwright install --with-deps webkit
      - name: Run
        run: |
          mkdir -p /tmp/srv && ln -s "$PWD" /tmp/srv/Pinyin
          (cd /tmp/srv && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node tools/chu-han/webkit-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: report, path: "chu-han-*"}
