name: Giữ kho đồng bộ luôn thức
# Supabase gói miễn phí tự tạm dừng nếu 7 ngày không ai dùng → gõ nhẹ mỗi 3 ngày
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          KEY=$(grep -oE "key: '[^']+'" shared/sync.js | head -1 | cut -d"'" -f2)
          URL=$(grep -oE "url: 'https://[^']+'" shared/sync.js | head -1 | cut -d"'" -f2)
          curl -fsS -X POST "$URL/rest/v1/rpc/bm_ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "%{http_code}\n"
