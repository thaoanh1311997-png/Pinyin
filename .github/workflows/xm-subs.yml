name: xm-subs
on:
  push:
    branches: [xm-subs]
    paths: ['.github/workflows/xm-subs.yml']
permissions:
  contents: write
jobs:
  cands:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: xm-subs }
      - run: pip install -q pillow numpy
      - run: timeout 95m python3 tools/cands2.py || true
        env: { SHARD: '${{ matrix.shard }}', NSHARD: '5' }
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out && git commit -qm "cands2 shard ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push && break; sleep $((RANDOM%10+5)); done
