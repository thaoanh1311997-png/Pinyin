name: xm-subs
on:
  push:
    branches: [xm-subs]
    paths: ['.github/workflows/xm-subs.yml']
permissions:
  contents: write
jobs:
  cands:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: xm-subs }
      - run: pip install -q pillow numpy
      - run: python3 tools/cands2.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out && git commit -qm "cands2 out" && git push
