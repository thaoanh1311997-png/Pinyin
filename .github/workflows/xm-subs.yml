name: xm-subs
on:
  push:
    branches: [xm-subs]
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pip install -q -U "yt-dlp[default]"
      - run: |
          mkdir out && cd out
          X='--extractor-args youtube:player_client=tv_simply,web_embedded,mweb,default'
          for q in "brushing teeth english conversation for kids" "peppa pig brushing teeth" "brush your teeth toddler english mom" "bedtime routine english conversation kids"; do
            yt-dlp $X --flat-playlist --print "%(id)s|%(duration)s|%(channel)s|%(title)s" "ytsearch12:$q" >> search.txt 2>>err.txt || true
          done
          cat search.txt
          for id in S4Z841ktMNQ tYDuAfY77Do; do
            yt-dlp $X --skip-download --write-subs --write-auto-subs --sub-langs "en.*" --sub-format json3 --print "%(id)s|%(duration)s|%(channel)s|%(title)s|%(playable_in_embed)s" -o "%(id)s" "https://www.youtube.com/watch?v=$id" 2>>err.txt || true
          done
          tail -20 err.txt; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: subs, path: out }
