name: xm-subs
on:
  push:
    branches: [xm-subs]
    paths: ['.github/workflows/xm-subs.yml']
permissions:
  contents: write
jobs:
  cands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: xm-subs }
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/cands.mjs
      - run: pip install -q pillow && python3 tools/sheet.py && rm -rf out/c
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out && git commit -qm "cands out" && git push
