name: xm-subs
on:
  push:
    branches: [xm-subs]
    paths: ['.github/workflows/xm-subs.yml']
permissions:
  contents: write
jobs:
  color:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: xm-subs }
      - run: pip install -q gradio_client
      - run: timeout 45m python3 tools/color2.py || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out4 && git commit -qm "color test" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push && break; sleep 5; done
