name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node trasua/tools/fetch-news.mjs && node -e "const j=require(\"./trasua/data/news.json\");for(const a of j.items.slice(0,6))console.log(JSON.stringify(a))"
