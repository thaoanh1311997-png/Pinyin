name: Tài liệu miễn phí · tải sách PDF mở
on:
  push:
    branches: [main]
    paths: ['sach/tools/fetch-books.mjs', '.github/workflows/sach-books.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sach-books
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Download open-licensed / public-domain PDFs
        run: rm -rf sach/books && node sach/tools/fetch-books.mjs
      - name: Commit
        run: |
          git config user.name "sach-bot"; git config user.email "sach-bot@users.noreply.github.com"
          git add -A sach/books sach/data/books.json sach/data/books-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Tài liệu miễn phí: cập nhật sách PDF mở"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
