name: Học video giữ file gốc test (manual)
on: workflow_dispatch
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "shared\nvideo\nsach\ndict.txt\naudio/zh/index.bin\n!video/data/nghe/", sparse-checkout-cone-mode: false}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i --no-save playwright ffmpeg-static && npx playwright install webkit chromium
      - run: $(node -p "require('ffmpeg-static')") -v error -f lavfi -i "sine=frequency=440:duration=20" -b:a 64k small.mp3
      - run: $(node -p "require('ffmpeg-static')") -v error -f lavfi -i "sine=frequency=330:duration=60" -b:a 64k long.mp3
      - name: Serve site and run tests
        run: |
          mkdir -p /tmp/srv && ln -s "$PWD" /tmp/srv/Pinyin
          (cd /tmp/srv && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          perl -e 'alarm shift; exec @ARGV' 300 env BT=webkit node video/tools/media-keep-test.cjs || echo FAIL-EXIT media-keep-test webkit
          perl -e 'alarm shift; exec @ARGV' 300 node video/tools/media-keep-test.cjs || echo FAIL-EXIT media-keep-test
          perl -e 'alarm shift; exec @ARGV' 300 env BT=webkit node video/tools/resume-test.cjs || echo FAIL-EXIT resume-test webkit
          perl -e 'alarm shift; exec @ARGV' 300 node video/tools/resume-test.cjs || echo FAIL-EXIT resume-test
          perl -e 'alarm shift; exec @ARGV' 300 env BT=webkit node video/tools/player-test.cjs || echo FAIL-EXIT player-test webkit
          perl -e 'alarm shift; exec @ARGV' 300 node video/tools/player-test.cjs || echo FAIL-EXIT player-test
          perl -e 'alarm shift; exec @ARGV' 300 env BT=webkit node video/tools/nghe-test.cjs || echo FAIL-EXIT nghe-test webkit
          perl -e 'alarm shift; exec @ARGV' 300 node video/tools/nghe-test.cjs || echo FAIL-EXIT nghe-test
