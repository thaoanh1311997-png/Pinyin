name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Update Trà Sữa news (chinanews RSS)
        continue-on-error: true
        run: |
          node trasua/tools/fetch-news.mjs
          if ! git diff --quiet -- trasua/data/news.json || [ -n "$(git status --porcelain trasua/data/news.json)" ]; then
            git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
            git add trasua/data/news.json && git commit -m "Update news" && git push || true
          fi
      - name: Trà Sữa news photos (thumbnails into the site, not committed)
        continue-on-error: true
        run: node trasua/tools/thumbs.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
