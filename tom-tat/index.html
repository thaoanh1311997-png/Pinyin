<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="../shared/nav-head.js?v=17"></script>
<title>Tóm tắt đoạn văn · Bánh Mì</title>
<meta name="description" content="Dán đoạn hội thoại hay bài khóa tiếng Trung, nhận đoạn văn xuôi tóm tắt khoảng 200 chữ, có pinyin, bản dịch tiếng Việt và nghe đọc.">
<meta name="theme-color" content="#FFF7EC">
<link rel="icon" href="../shared/banhmi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/banhmi-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@600;700;800;900&family=Inter:wght@500;600&display=swap">
<style>
:root{--bg:#FFF7EC;--ink:#3B2414;--ink2:#7A5F4C;--card:#fff;--line:#F1E2CF;--soft:#FBEAF6;--ac:#B4479C;--ac2:#E98BD3;--acd:#8E2F7A;--py:#C2410C;--ok:#12A66A;--bad:#D64545;
  --f:Nunito,"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--pyf:Inter,system-ui,sans-serif}
html[data-theme="dark"]{--bg:#1B1410;--ink:#F7EBDD;--ink2:#CDB6A3;--card:#2A201A;--line:#45352A;--soft:#3A2335;--ac:#E07BC8;--ac2:#8E3C80;--acd:#F3A6E0;--py:#FFA26B;--ok:#5FDBA5;--bad:#FF8A8A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 60px}
/* hero */
.hero{position:relative;border-radius:28px;padding:20px 18px 18px;background:linear-gradient(135deg,#FFE1F3,#FFF0DC 70%);overflow:hidden;animation:up .45s ease-out both}
html[data-theme="dark"] .hero{background:linear-gradient(135deg,#3A2135,#3A2A18 70%)}
.hero::after{content:"述";position:absolute;right:-6px;bottom:-34px;font:700 130px/1 var(--zh);color:var(--ac);opacity:.09}
.hero .hi{display:inline-block;font:700 14px var(--zh);color:var(--acd);background:rgba(255,255,255,.75);padding:3px 11px;border-radius:99px}
html[data-theme="dark"] .hero .hi{background:#2A201A}
.hero h1{margin:8px 0 4px;font-size:28px;line-height:1.15;font-weight:900}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{margin:0;color:var(--ink2);font-size:15.5px;max-width:520px}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
/* card */
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin-top:14px;animation:up .45s ease-out both}
.card h2{margin:0 0 10px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
textarea{width:100%;min-height:190px;resize:vertical;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--bg);font:500 17px/1.7 var(--zh);outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--ac)}
textarea::placeholder{font-family:var(--f);font-weight:700;color:#B9A08C}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pk{display:flex;align-items:center;justify-content:center;gap:7px;border:2px dashed var(--ac2);background:var(--soft);color:var(--acd);border-radius:16px;padding:11px 8px;font-weight:900;font-size:15.5px;cursor:pointer;text-align:center;line-height:1.25;transition:transform .12s}
.pk:active{transform:scale(.96)}
.pk small{display:block;font-weight:700;font-size:12px;opacity:.8}
.pk input{display:none}
.fst{margin:-2px 0 10px;padding:10px 12px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-size:14.5px}
.fst .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.fst .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.fst .rg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.fst .rg input{width:64px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);font-weight:800;text-align:center}
.fst.bad{background:#FFE8E8;color:#9B1C1C;border-color:#F5C2C2}
html[data-theme="dark"] .fst.bad{background:#3E1F22;color:#FFB3B3;border-color:#6B3438}
textarea.drag{border-color:var(--ac);background:var(--soft)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--ink2);font-size:14px}
.meta .sp{flex:1}
.lnk{background:none;border:0;padding:4px 2px;color:var(--ac);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.lbl{font-size:15px;font-weight:800;color:var(--ink2);margin-right:2px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;font-weight:800;font-size:14px;transition:all .15s;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:18px;padding:12px 18px;font-weight:900;font-size:16px;background:var(--soft);color:var(--acd);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#D468B8);color:#fff;box-shadow:0 5px 0 #8A2F75;font-size:18px;padding:14px 20px}
.btn.pri:active{box-shadow:0 2px 0 #8A2F75;transform:translateY(3px)}
.btn.pri[disabled]{opacity:.6;cursor:wait}
.btn.sm{padding:8px 12px;font-size:14.5px;border-radius:14px}
.go{width:100%;margin-top:16px}
.keybox{margin-top:12px;padding:12px;border-radius:16px;background:var(--soft)}
.keybox input{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:15px}
.keybox small{display:block;color:var(--ink2);font-size:13.5px;margin-top:6px}
/* progress */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:15.5px;color:var(--ink2)}
.steps li i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--line)}
.steps li.run{color:var(--ink)}.steps li.run i{background:var(--soft);border:3px solid var(--ac);border-right-color:transparent;animation:spin .8s linear infinite}
.steps li.ok{color:var(--ink)}.steps li.ok i{background:var(--ok);color:#fff}
.steps li small{color:var(--ink2);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.err{margin-top:10px;padding:10px 12px;border-radius:14px;background:#FFE8E8;color:#9B1C1C;font-size:15px}
html[data-theme="dark"] .err{background:#3E1F22;color:#FFB3B3}
/* result */
.badge{font-size:13.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--acd)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tg{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 12px;font-weight:800;font-size:14.5px}
.tg.on{border-color:var(--ac);color:var(--acd);background:var(--soft)}
.zh{font:500 21px/2.05 var(--zh);text-align:left;word-break:break-all;letter-spacing:.5px}
.zh.py{line-height:2.6}
.zh ruby{ruby-position:over;margin:0 1px}
.zh rt{font:500 12.5px/1 var(--pyf);color:var(--py);letter-spacing:0}
.zh .s{border-radius:8px;transition:background .2s;cursor:pointer}
.zh .s.say{background:#FFE9A8}
html[data-theme="dark"] .zh .s.say{background:#5A4318}
.vi{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-size:17px;line-height:1.7;font-weight:600}
.vi b{display:block;font-size:14px;color:var(--ink2);font-weight:800;margin-bottom:2px}
.pts{margin:0;padding-left:22px;font-size:16px;line-height:1.6;font-weight:600}
.pts li{margin:3px 0}
.pair{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.pair:last-child{border-bottom:0}
.pair .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--acd);display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:4px}
.pair .t{flex:1;min-width:0}
.pair .pz{font:500 18px/1.6 var(--zh)}
.pair .pp{font:500 14px/1.5 var(--pyf);color:var(--py)}
.pair .pv{font-size:15.5px;font-weight:600;color:var(--ink2)}
.pair button{flex:none;border:0;background:var(--soft);border-radius:12px;width:38px;height:38px;font-size:17px}
details.card summary{cursor:pointer;font-size:18px;font-weight:900;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";margin-left:auto;font-size:24px;color:var(--ink2);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
details.card[open] summary{margin-bottom:8px}
.note{font-size:14px;color:var(--ink2);margin-top:8px}
/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hi-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg);border:2px solid var(--line);text-align:left;width:100%}
.hi-it .tx{flex:1;min-width:0}
.hi-it b{display:block;font:500 16px/1.4 var(--zh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-it small{color:var(--ink2);font-size:13px}
.hi-it .x{border:0;background:none;color:var(--ink2);font-size:18px;padding:4px 6px}
.empty{color:var(--ink2);font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#3B2414;color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;font-size:15px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:720px){.hero{padding:28px 30px 24px}.hero h1{font-size:36px}.card{padding:20px 22px}.zh{font-size:23px}}
@media (max-width:370px){.hero h1{font-size:25px}.zh{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#bm-nav,.hero,#inCard,#histCard,.tools,.toast,.pair button{display:none!important}.card{border:0;padding:0}}
</style>
</head>
<body>
<script src="../shared/nav.js?v=17"></script>
<script src="../shared/voice.js?v=1"></script>

<main class="wrap">
  <header class="hero">
    <span class="hi" lang="zh-CN">🪄 复述 · 缩写</span>
    <h1>Tóm tắt <em>đoạn văn</em></h1>
    <p>Dán hội thoại hay bài trong sách vào, Bánh Mì viết lại thành một đoạn văn xuôi tiếng Trung đủ ý, có pinyin và tiếng Việt.</p>
  </header>

  <section class="card" id="inCard">
    <h2>📋 Đoạn văn của bạn</h2>
    <div class="picks">
      <label class="pk">📷 <span>Ảnh chụp sách<small>được nhiều ảnh</small></span><input type="file" id="imgIn" accept="image/*" multiple></label>
      <label class="pk">📎 <span>Chọn tệp<small>PDF · Word · .txt</small></span><input type="file" id="fileIn" accept=".pdf,.docx,.txt,.doc,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/*" multiple></label>
    </div>
    <div class="fst hidden" id="fst"></div>
    <textarea id="src" lang="zh-CN" placeholder="…hoặc dán đoạn hội thoại, bài khóa tiếng Trung vào đây"></textarea>
    <div class="meta"><span id="cnt">0 chữ</span><span class="sp"></span><button class="lnk" id="pasteBtn" type="button">📥 Dán</button><button class="lnk" id="sampleBtn" type="button">Thử đoạn mẫu</button><button class="lnk" id="clearBtn" type="button">Xoá</button></div>
    <div class="row"><span class="lbl">Độ dài:</span>
      <button class="chip" type="button" data-n="150">150 chữ</button>
      <button class="chip on" type="button" data-n="200">200 chữ</button>
      <button class="chip" type="button" data-n="300">300 chữ</button>
    </div>
    <div class="keybox hidden" id="keyBox">
      <label for="keyInp">🔑 Key AI Groq (miễn phí, chỉ nhập 1 lần trên máy này)</label>
      <input id="keyInp" placeholder="gsk_…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <small>Máy nào đã dùng “Tài liệu ôn” thì có sẵn key rồi, không cần nhập.</small>
    </div>
    <button class="btn pri go" id="goBtn" type="button">🪄 Tóm tắt</button>
  </section>

  <section class="card hidden" id="progCard">
    <h2>⏳ Bánh Mì đang viết…</h2>
    <ul class="steps" id="steps"></ul>
    <div class="err hidden" id="err"></div>
  </section>

  <div id="out"></div>

  <section class="card" id="histCard">
    <h2>🗂️ Đã tóm tắt <span class="sp"></span></h2>
    <div class="hist" id="hist"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="../trasua/lib/pinyin-pro.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}
var tt=null; function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on")},2600); }
var HAN=/[㐀-鿿]/g;
function hanCount(s){ return (String(s).match(HAN)||[]).length; }

/* ---------------- pinyin (từ điển pinyin-pro, không dùng AI) ---------------- */
var PY=window.pinyinPro;
try{ PY.customPinyin({ '长满':'zhǎng mǎn','长高':'zhǎng gāo','长出':'zhǎng chū','长得':'zhǎng de','长胖':'zhǎng pàng','长大':'zhǎng dà','调高':'tiáo gāo','调低':'tiáo dī','背不动':'bēi bú dòng','背着':'bēi zhe','背起':'bēi qǐ','种了':'zhòng le','种树':'zhòng shù','种菜':'zhòng cài','还给':'huán gěi','还钱':'huán qián','还书':'huán shū','一点儿':'yì diǎn r','一会儿':'yí huì r','一块儿':'yí kuài r','玩儿':'wán r','哪儿':'nǎ r','这儿':'zhè r','那儿':'nà r','有点儿':'yǒu diǎn r','一下儿':'yí xià r','好好儿':'hǎo hāo r','慢慢儿':'màn mān r','没事儿':'méi shì r','和尚':'hé shang','石头':'shí tou','只会':'zhǐ huì','只剩':'zhǐ shèng','只好':'zhǐ hǎo','只有':'zhǐ yǒu','只是':'zhǐ shì','只能':'zhǐ néng','着急':'zháo jí','睡着':'shuì zháo','找着':'zhǎo zháo','看中文':'kàn zhōng wén','看中国':'kàn zhōng guó','人参加':'rén cān jiā','生长':'shēng zhǎng','有空':'yǒu kòng','没空':'méi kòng','倒水':'dào shuǐ','提供':'tí gōng','舍不得':'shě bu de','踏实':'tā shi','觉得':'jué de','记得':'jì de','晓得':'xiǎo de','了解':'liǎo jiě','为了':'wèi le','得到':'dé dào','得了':'dé le','教书':'jiāo shū','教汉语':'jiāo hàn yǔ','教中文':'jiāo zhōng wén','教我':'jiāo wǒ','教他':'jiāo tā','教她':'jiāo tā','教你':'jiāo nǐ','教孩子':'jiāo hái zi','一行人':'yì xíng rén','银行':'yín háng','行李':'xíng li','差不多':'chà bu duō','东西':'dōng xi','朋友':'péng you','衣服':'yī fu','休息':'xiū xi','漂亮':'piào liang','认识':'rèn shi','告诉':'gào su','知道':'zhī dao','打算':'dǎ suan','意思':'yì si','客气':'kè qi','舒服':'shū fu','麻烦':'má fan','明白':'míng bai','清楚':'qīng chu','喜欢':'xǐ huan','先生':'xiān sheng','学生':'xué sheng','时候':'shí hou','地方':'dì fang','事情':'shì qing','关系':'guān xi','名字':'míng zi','爸爸':'bà ba','妈妈':'mā ma','哥哥':'gē ge','姐姐':'jiě jie','弟弟':'dì di','妹妹':'mèi mei','孩子':'hái zi','儿子':'ér zi','女儿':'nǚ ér','头发':'tóu fa','暖和':'nuǎn huo','凉快':'liáng kuai','热闹':'rè nao','聪明':'cōng ming','奇怪':'qí guài','便宜':'pián yi','商量':'shāng liang','收拾':'shōu shi','照顾':'zhào gù','打扮':'dǎ ban','打扫':'dǎ sǎo' }); }catch(e){}
var DE_NEXT='到意出分奖病罪知失益体当以逞手宠势票主天',DE_PRE='获取难心赢求所舍免自夺彼雅安',DEI_PRE='我你他她它们就也都少须还',DI_PRE='了在等局海两多一散的满土大天当各本外内此场基草田园陆山盆工目该某产境遍原落空耕荒雪平高低绿圣宝福胜营阵驻腹属领湿沼盐坡谷洼旱农墓',DI_NEXT='方区点图球铁下上面址带震位磁边毯板道里主形质狱块段域势标壳盘基契租价产铺砖窖心底层图';
function fixPy(r){
  for(var i=0;i<r.length;i++){ var x=r[i],pv=r[i-1],nx=r[i+1]; if(!x.isZh||!pv||!pv.isZh) continue;
    if(x.origin==='得'&&x.pinyin==='dé'&&!(nx&&nx.isZh&&DE_NEXT.indexOf(nx.origin)>=0)&&DE_PRE.indexOf(pv.origin)<0&&!(pv.origin==='不'&&nx&&nx.origin==='不')) x.pinyin=DEI_PRE.indexOf(pv.origin)>=0&&nx&&nx.isZh?'děi':'de';
    else if(x.origin==='地'&&x.pinyin==='dì'&&nx&&nx.isZh&&(DI_PRE.indexOf(pv.origin)<0||/适当|恰当|相当|充分/.test((r[i-2]?r[i-2].origin:'')+pv.origin))&&DI_NEXT.indexOf(nx.origin)<0&&(r[i-2]&&r[i-2].isZh)) x.pinyin='de';
  }
  return r;
}
function pyAll(t){ try{ return fixPy(PY.pinyin(t,{type:'all'})); }catch(e){ return [].map.call(t,function(c){return{origin:c,pinyin:'',isZh:/[㐀-鿿]/.test(c)}}); } }
function ruby(t){ return pyAll(t).map(function(x){ return x.isZh?'<ruby>'+esc(x.origin)+'<rt>'+esc(x.pinyin)+'</rt></ruby>':esc(x.origin); }).join(''); }
function pyLine(t){ return pyAll(t).filter(function(x){return x.isZh||/[，。！？；：、,.!?;:]/.test(x.origin)}).map(function(x){return x.isZh?x.pinyin:x.origin.replace(/[，、]/,',').replace(/[。]/,'.').replace(/[！]/,'!').replace(/[？]/,'?').replace(/[；]/,';').replace(/[：]/,':')}).join(' ').replace(/ ([,.!?;:])/g,'$1'); }

/* ---------------- giọng đọc ---------------- */
var speaking=null;
function stopSay(){ try{ if(window.BMVoice) BMVoice.stop(); }catch(e){} document.querySelectorAll(".s.say").forEach(function(x){x.classList.remove("say")}); speaking=null; }
function say(t,el){ try{ if(!window.BMVoice||!BMVoice.available()){ toast("Máy này chưa đọc được tiếng Trung"); return Promise.resolve(false); }
  stopSay(); if(el) el.classList.add("say"); var me=speaking={};
  return BMVoice.speak(t,{rate:0.85}).then(function(r){ if(el) el.classList.remove("say"); return r&&speaking===me; },function(){ if(el) el.classList.remove("say"); return false; }); }catch(e){ return Promise.resolve(false); } }

function retryIn(t){ var m=String(t).match(/try again in\s*((?:[\d.]+h)?(?:[\d.]+m(?!s))?(?:[\d.]+s)?(?:[\d.]+ms)?)/i); if(!m||!m[1]) return 0;

/* gọi AI, trả về JSON. avoid: model nên tránh (để bước soát lỗi dùng model khác) */
function groq(messages,maxTok,onWait,avoid){
  var key=groqKey(), net=0, srv=0;
  function pick(){ var now=Date.now(), best=null;
    for(var i=0;i<MODELS.length;i++){ var m=MODELS[i], st=MST[m.id]=MST[m.id]||{}; if(st.dead) continue;
      var w=Math.max(0,(st.until||0)-now)+(m.id===avoid?1500:0); if(!best||w<best.w) best={m:m,w:w}; }
    return best; }
  function go(){
    var pk=pick(); if(!pk) return Promise.reject(new Error("AI miễn phí đang bận hoặc hết lượt hôm nay, lát nữa thử lại nha"));
    if(pk.w>1500){ if(pk.w>20*60*1000) return Promise.reject(new Error("Hết lượt AI miễn phí hôm nay, mai thử lại nha")); if(onWait) onWait(Math.ceil(pk.w/1000)); return sleep(Math.min(pk.w,15000)).then(go); }
    var m=pk.m, st=MST[m.id];
    var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },90000);
    var body={model:m.id,messages:messages,temperature:0.3,max_tokens:maxTok,response_format:{type:"json_object"}}; for(var k in (m.x||{})) body[k]=m.x[k];
    return fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
    .then(function(r){
      clearTimeout(to); net=0;
      if(r.status===401) throw new Error("KEY");
      if(r.status===429||r.status===413) return r.text().then(function(t){
        var ra=parseFloat(r.headers.get("retry-after"))||0, ri=retryIn(t), day=/per day|TPD|RPD/i.test(t);
        if(r.status===413||/Requested\s*\d+/i.test(t)&&/per minute|TPM/i.test(t)&&!ri){ st.until=Date.now()+60000; return go(); }
        st.until=Date.now()+Math.max(ri,ra,day?900:6)*1000+400; return go(); });
      if(r.status>=500){ srv++; if(srv>6) throw new Error("Máy chủ AI đang lỗi, lát nữa thử lại nha"); st.until=Date.now()+4000*srv; return go(); }
      if(r.status===400||r.status===404) return r.text().then(function(t){
        if(/json_validate_failed|failed_generation/i.test(t)&&(st.jf=(st.jf||0)+1)<3) return go();
        st.dead=true; return go(); });
      if(!r.ok) throw new Error("AI lỗi "+r.status);
      return r.json().then(function(j){
        var c=(j.choices&&j.choices[0].message.content)||""; c=c.replace(/<think>[\s\S]*?<\/think>/g,"");
        try{ var o=JSON.parse(c); o._m=m.id; return o; }catch(e){ var mm=c.match(/\{[\s\S]*\}/); if(mm) try{ var o2=JSON.parse(mm[0]); o2._m=m.id; return o2; }catch(e2){} st.until=Date.now()+1000; return go(); } });
    },function(e){
      clearTimeout(to); if(e&&e.message&&/KEY|Máy chủ|Hết lượt|AI lỗi/.test(e.message)) throw e;
      net++; if(net>4) throw new Error("Mạng chập chờn, kiểm tra mạng rồi bấm lại nha");
      if(onWait) onWait(3*net); return sleep(3000*net).then(go);
    });
  }
  return go();
}

  if(d){ var a=getHist().filter(function(x){return x.id!==d.dataset.del}); ls("tt.hist",JSON.stringify(a)); drawHist(); toast("Đã xoá"); return; }
  var it=e.target.closest(".hi-it"); if(!it) return; var r=getHist().filter(function(x){return x.id===it.dataset.id})[0]; if(!r) return;
  stopSay(); render(r); $("#progCard").classList.add("hidden"); setTimeout(function(){ $("#resCard").scrollIntoView({behavior:"smooth",block:"start"}); },50); };
$("#hist").onkeydown=function(e){ if(e.key==="Enter"&&e.target.classList.contains("hi-it")) e.target.click(); };
drawHist();
window.addEventListener("storage",function(e){ if(e.key==="tt.hist") drawHist(); });
window.TT={summarize:summarize,clean:clean,tidy:tidy,sentences:sentences,hanCount:hanCount,pyLine:pyLine,render:render,SYS:{SUM:SYS_SUM,LEN:SYS_LEN,CHK:SYS_CHK,VI:SYS_VI},fill:fill,groq:groq};
})();
